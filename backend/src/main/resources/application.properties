spring.application.name=api
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Banco H2 em memória para desenvolvimento
spring.datasource.url=jdbc:h2:mem:socialconnectdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# O Hibernate valida o esquema criado pelas migrations, sem alterá-lo
spring.jpa.hibernate.ddl-auto=validate

# Flyway: migrations versionadas do banco
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Console H2 para inspeção durante o desenvolvimento
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
